name: todo-tool
prompt: |
  请用 todo_write 工具建立一条任务列表，包含两项：第一项是「安装插件」，第二项是「跑评测」。
  必须真实调用 todo_write 工具；完成后只回复一个词：TODODONE。
require_plugins: ["@deepseek-ai/dsh-tool-todo"]
assert:
  turn_end: completed
  tools_called: ["todo_write"]
  output_contains: ["TODODONE"]
  # 结果型断言：todo_write 真实建好两项才会返回 "2 pending"（baseline："Updated todo list:
  # 2 pending, 0 in progress, 0 completed."）。文案随 dsh 版本变化，升级时须人工确认口径
  tool_result_contains:
    - name: todo_write
      contains: "2 pending"
  max_steps: 8
  max_tokens: 30000
