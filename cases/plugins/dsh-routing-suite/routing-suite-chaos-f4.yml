# L3 chaos 韧性：挂载态 F4 once（对照 chaos-f4：检出 → exit 1 / max-tokens）
name: routing-suite-chaos-f4
prompt: |
  写一份三节分析报告。直接输出报告全文，不要调用任何工具。
tags: [plugins, chaos]
mock:
  fault: F4
  once: true
  plugins: ["https://codeload.github.com/yjh051108/dsh-routing-suite/tar.gz/195273352f23bff7f9023ebe2ec0cdbdf9c98f10"]
assert:
  turn_end: max-tokens
  exit_code: 1
  output_contains: ["【Q24】"]
  max_steps: 6
